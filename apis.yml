aid: impartner
name: Impartner
description: >-
  Impartner is a SaaS-based Partner Relationship Management (PRM) and partner revenue orchestration
  platform, founded in 1997 and headquartered in South Jordan, Utah, and backed by Emergence Capital.
  It helps enterprises manage the full indirect-channel lifecycle - partner recruitment, onboarding,
  deal registration, co-selling, through-channel marketing automation (TCMA), and performance
  measurement - from a single connected system. For developers and integrators, Impartner exposes an
  Objects API (version 1) over both REST and SOAP, queried with THQL (The Impartner Query Language),
  secured by an Auth0-based OAuth2 / OpenID Connect identity layer plus per-tenant API keys, and
  extended through workflow-engine webhooks and a family of first-party @impartner npm packages,
  design system, and CLI for building applications on Impartner Orchestration Studio.
